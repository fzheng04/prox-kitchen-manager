<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-body);color:var(--text-primary);background:var(--surface-app)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw b{display:block;height:56px;border-radius:var(--radius-sm);border:var(--outline)}.sw span{font-size:11px;line-height:1.25}.sw code{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)}</style></head><body><div style="display:flex;align-items:flex-end;gap:16px"><div style="text-align:center;font-size:11px"><div style="width:var(--space-half);height:var(--space-half);background:var(--accent);border:1.5px solid var(--ink);margin:0 auto 6px"></div>half</div><div style="text-align:center;font-size:11px"><div style="width:var(--space-1);height:var(--space-1);background:var(--accent);border:1.5px solid var(--ink);margin:0 auto 6px"></div>1</div><div style="text-align:center;font-size:11px"><div style="width:var(--space-2);height:var(--space-2);background:var(--accent);border:1.5px solid var(--ink);margin:0 auto 6px"></div>2</div><div style="text-align:center;font-size:11px"><div style="width:var(--space-3);height:var(--space-3);background:var(--accent);border:1.5px solid var(--ink);margin:0 auto 6px"></div>3</div><div style="text-align:center;font-size:11px"><div style="width:var(--space-4);height:var(--space-4);background:var(--accent);border:1.5px solid var(--ink);margin:0 auto 6px"></div>4</div><div style="text-align:center;font-size:11px"><div style="width:var(--space-5);height:var(--space-5);background:var(--accent);border:1.5px solid var(--ink);margin:0 auto 6px"></div>5</div><div style="text-align:center;font-size:11px"><div style="width:var(--space-6);height:var(--space-6);background:var(--accent);border:1.5px solid var(--ink);margin:0 auto 6px"></div>6</div><div style="text-align:center;font-size:11px"><div style="width:var(--space-8);height:var(--space-8);background:var(--accent);border:1.5px solid var(--ink);margin:0 auto 6px"></div>8</div><div style="text-align:center;font-size:11px"><div style="width:var(--space-16);height:var(--space-16);background:var(--accent);border:1.5px solid var(--ink);margin:0 auto 6px"></div>16</div></div></body></html>
