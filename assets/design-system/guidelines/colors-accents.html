<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-body);color:var(--text-primary);background:var(--surface-app)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw b{display:block;height:56px;border-radius:var(--radius-sm);border:var(--outline)}.sw span{font-size:11px;line-height:1.25}.sw code{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)}</style></head><body><div class="row"><div class="sw"><b style="background:var(--sage-300)"></b><span>Sage 300<br><code>--sage-300</code></span></div><div class="sw"><b style="background:var(--sage-400)"></b><span>Sage 400<br><code>--sage-400</code></span></div><div class="sw"><b style="background:var(--mustard-300)"></b><span>Mustard 300<br><code>--mustard-300</code></span></div><div class="sw"><b style="background:var(--mustard-500)"></b><span>Mustard 500<br><code>--mustard-500</code></span></div><div class="sw"><b style="background:var(--red-500)"></b><span>Red 500<br><code>--red-500</code></span></div><div class="sw"><b style="background:var(--red-100)"></b><span>Red 100<br><code>--red-100</code></span></div></div></body></html>
