<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-body);color:var(--text-primary);background:var(--surface-app)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw b{display:block;height:56px;border-radius:var(--radius-sm);border:var(--outline)}.sw span{font-size:11px;line-height:1.25}.sw code{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)}</style></head><body><div class="row"><div class="sw"><b style="background:var(--surface-app)"></b><span>surface-app<br><code>--surface-app</code></span></div><div class="sw"><b style="background:var(--surface-card)"></b><span>surface-card<br><code>--surface-card</code></span></div><div class="sw"><b style="background:var(--surface-header)"></b><span>surface-header<br><code>--surface-header</code></span></div><div class="sw"><b style="background:var(--surface-deep)"></b><span>surface-deep<br><code>--surface-deep</code></span></div><div class="sw"><b style="background:var(--accent)"></b><span>accent<br><code>--accent</code></span></div><div class="sw"><b style="background:var(--price)"></b><span>price<br><code>--price</code></span></div><div class="sw"><b style="background:var(--price-on-dark)"></b><span>price-on-dark<br><code>--price-on-dark</code></span></div></div></body></html>
