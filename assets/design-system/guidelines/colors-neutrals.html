<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-body);color:var(--text-primary);background:var(--surface-app)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw b{display:block;height:56px;border-radius:var(--radius-sm);border:var(--outline)}.sw span{font-size:11px;line-height:1.25}.sw code{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)}</style></head><body><div class="row"><div class="sw"><b style="background:var(--oat-100)"></b><span>Oat 100<br><code>--oat-100</code></span></div><div class="sw"><b style="background:var(--oat-50)"></b><span>Oat 50<br><code>--oat-50</code></span></div><div class="sw"><b style="background:var(--paper)"></b><span>Paper<br><code>--paper</code></span></div><div class="sw"><b style="background:var(--ink)"></b><span>Ink<br><code>--ink</code></span></div><div class="sw"><b style="background:var(--stone-500)"></b><span>Stone 500<br><code>--stone-500</code></span></div><div class="sw"><b style="background:var(--stone-300)"></b><span>Stone 300<br><code>--stone-300</code></span></div></div></body></html>
