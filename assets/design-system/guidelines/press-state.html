<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-body);color:var(--text-primary);background:var(--surface-app)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw b{display:block;height:56px;border-radius:var(--radius-sm);border:var(--outline)}.sw span{font-size:11px;line-height:1.25}.sw code{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)}</style></head><body><div class="row" style="gap:32px;align-items:center"><div style="padding:14px 26px;border:var(--outline);border-radius:var(--radius-md);background:var(--accent);color:#fff;font-family:var(--font-display);font-weight:700;box-shadow:var(--shadow-hard)">Rest</div><div style="padding:14px 26px;border:var(--outline);border-radius:var(--radius-md);background:var(--accent-pressed);color:#fff;font-family:var(--font-display);font-weight:700;box-shadow:0 0 0 var(--ink);transform:translateY(3px)">Pressed</div><span style="font-size:12px;color:var(--text-secondary)">drop by shadow height, shadow → 0, bg darkens</span></div></body></html>
