<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-body);color:var(--text-primary);background:var(--surface-app)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw b{display:block;height:56px;border-radius:var(--radius-sm);border:var(--outline)}.sw span{font-size:11px;line-height:1.25}.sw code{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)}</style></head><body><div class="row"><div style="display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border:var(--outline);border-radius:999px;background:var(--cat-produce-bg);box-shadow:var(--shadow-hard-sm);font-family:var(--font-display);font-weight:800;font-size:15px;text-transform:capitalize"><i style="width:18px;height:18px;border-radius:6px;border:2px solid var(--ink);background:var(--cat-produce)"></i>produce</div><div style="display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border:var(--outline);border-radius:999px;background:var(--cat-dairy-bg);box-shadow:var(--shadow-hard-sm);font-family:var(--font-display);font-weight:800;font-size:15px;text-transform:capitalize"><i style="width:18px;height:18px;border-radius:6px;border:2px solid var(--ink);background:var(--cat-dairy)"></i>dairy</div><div style="display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border:var(--outline);border-radius:999px;background:var(--cat-meat-bg);box-shadow:var(--shadow-hard-sm);font-family:var(--font-display);font-weight:800;font-size:15px;text-transform:capitalize"><i style="width:18px;height:18px;border-radius:6px;border:2px solid var(--ink);background:var(--cat-meat)"></i>meat</div><div style="display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border:var(--outline);border-radius:999px;background:var(--cat-pantry-bg);box-shadow:var(--shadow-hard-sm);font-family:var(--font-display);font-weight:800;font-size:15px;text-transform:capitalize"><i style="width:18px;height:18px;border-radius:6px;border:2px solid var(--ink);background:var(--cat-pantry)"></i>pantry</div><div style="display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border:var(--outline);border-radius:999px;background:var(--cat-essentials-bg);box-shadow:var(--shadow-hard-sm);font-family:var(--font-display);font-weight:800;font-size:15px;text-transform:capitalize"><i style="width:18px;height:18px;border-radius:6px;border:2px solid var(--ink);background:var(--cat-essentials)"></i>essentials</div><div style="display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border:var(--outline);border-radius:999px;background:var(--cat-frozen-bg);box-shadow:var(--shadow-hard-sm);font-family:var(--font-display);font-weight:800;font-size:15px;text-transform:capitalize"><i style="width:18px;height:18px;border-radius:6px;border:2px solid var(--ink);background:var(--cat-frozen)"></i>frozen</div></div><p style="font-size:11px;color:var(--text-secondary);margin:14px 0 0">Frozen is an extension not seen in source screens.</p></body></html>
