# Runs the same checks as a reviewer on a clean checkout: install, typecheck, lint, unit tests,
# a web bundle build (catches import and bundling errors the tests don't), and a check that the
# deterministic seed generator still reproduces fixtures/seed.json.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

      - name: Seed is deterministic
        run: |
          npm run seed
          git diff --exit-code -- fixtures/

      - name: Web bundle builds
        run: npx expo export --platform web --output-dir dist
